# Настройки ноды antibot.
#
# Всё, чего здесь нет, берётся из умолчаний: нода обязана работать и с
# пустым файлом. Опечатка в имени поля — ошибка при запуске, а не молча
# проигнорированное намерение.

listen:
  http: ":8080"
  https: ":8443"
  # Проверка живости и счётчики. Наружу не публикуется: на 80 и 443 идёт
  # трафик клиентских доменов, и /healthz на них превратился бы в
  # страницу, которой нет, на каждом защищённом сайте.
  admin: "127.0.0.1:8091"

tls:
  # Каталог сертификатов: подкаталог на домен, внутри fullchain.pem с
  # privkey.pem (раскладка certbot) либо cert.pem с key.pem.
  #
  # Просматривается заново по таймеру, поэтому продление certbot'ом и
  # подключение нового домена вступают в силу без перезапуска.
  # certificates_dir: "/etc/letsencrypt/live"

  # Если сертификатов нет, выпускается самоподписанный и сохраняется
  # здесь — чтобы пережить перезапуск и не менять отпечаток сайта.
  self_signed_dir: "/var/lib/antibot/certs"
  reload_interval: 30s

# Маршруты по имени хоста. Три формы, в порядке убывания точности:
#
#   shop.example.ru      точное имя
#   "*.example.ru"       любой поддомен любой глубины, но не сам example.ru
#   "*"                  маршрут по умолчанию
#
# Порядок строк ни на что не влияет: выбирается сначала точное совпадение,
# затем самый длинный подходящий шаблон, и только потом умолчание.
#
# Оговорка про TLS: подстановочный знак в сертификате покрывает ровно одну
# метку, поэтому для a.b.example.ru маршрут по "*.example.ru" найдётся, а
# сертификат "*.example.ru" не подойдёт.
upstreams:
  - host: "*"
    to: "http://backend:80"

# Кому разрешено проставлять X-Forwarded-For.
#
# Пусто — заголовок игнорируется целиком, адресом клиента считается
# TCP-пир. Умолчание именно такое, потому что заголовок ставится одной
# строкой curl: доверять ему по умолчанию значит позволить любому
# назваться кем угодно.
trusted_proxies: []

# Свои адреса: мониторинг, VPN, рабочая машина. Проверяются раньше правил
# и всегда пропускаются.
#
# Это отдельный слой, а не правило с высоким приоритетом: своя сеть,
# вписанная исключением в десять правил, однажды окажется забытой в
# одиннадцатом — и собственный мониторинг попадёт под запрет.
own_networks: []

# Идентификатор установки: облаку он нужен ровно для того, чтобы отличать
# установки друг от друга. Нода создаёт его сама при первом запуске и не
# выводит ни из домена, ни из адреса, ни из железа.
node_id_file: "/var/lib/antibot/node.id"

events:
  dir: "/var/lib/antibot/events"
  # Файл, доросший до предела, закрывается, и записи идут в следующий.
  max_size: 268435456
  keep_days: 14
  # Сколько событий помещается в буфер до записи. При переполнении
  # событие теряется, но запрос не ждёт диска — счётчик потерь виден на
  # служебном порту, в /stats.
  queue: 4096

# Просмотровая админка: события, статистика и правила.
#
# Она ничего не меняет — ни правил, ни настроек. Правила меняются только
# командой antibot rules, и второго пути к ним нет: админка стоит на
# чужом периметре, и дыра в ней не должна становиться дырой в защите
# сайта.
#
# Нужна она затем, что антибот, чью работу не видно, не включают в режим
# блокировки: человек сначала смотрит, кого нода собирается резать, и
# только потом разрешает ей это делать.
#
# Вход обязателен: без учёток админка не поднимается вовсе. Завести —
# antibot admin passwd ИМЯ.
admin_ui:
  enabled: true
  listen: "127.0.0.1:8090"
  users_file: "/var/lib/antibot/admin.json"
  session_ttl: 12h

  # Не-loopback адрес без сертификата — отказ при запуске: пароль уходил
  # бы по сети открытым текстом. Хотите открыть админку наружу — сначала
  # задайте сертификат.
  # certificate: "/etc/letsencrypt/live/admin.example.ru/fullchain.pem"
  # key: "/etc/letsencrypt/live/admin.example.ru/privkey.pem"
  # На этом адресе HTTP отвечает перенаправлением кодом 308.
  # redirect_from: ":8089"

# Правила.
#
# Файл перечитывается на лету: изменение замечается по времени и размеру.
# Битое правило отбрасывает весь набор, а прежний остаётся в силе —
# набор, применённый наполовину, выглядит работающим и потому опаснее
# отказа.
#
# Меняется файл только командой antibot rules: единственный путь записи,
# видимый в истории оболочки.
rules:
  file: "/var/lib/antibot/rules.json"
  reload_interval: 5s

# Базы сетей и отпечатков.
#
# Приезжают подписанными, версионированными и ничего не блокируют сами:
# они меняют только то, как называется клиент. Что с ним делать, решает
# ваше правило. enabled: false выключает их применение целиком.
# Загрузка идёт раз в сутки плюс разброс. Токен берётся из cloud.token —
# он один на оба направления, и анонимной раздачи баз нет: facts.url без
# токена останавливает запуск.
#
# Кончившаяся подписка замораживает базу, но не снимает защиту: правила
# остаются в силе, устаревает только свежесть базы.
facts:
  enabled: true
  dir: "/var/lib/antibot/facts"
  # url: "https://updates.example.com/facts"
  interval: 24h

# Отправка обезличенных агрегатов.
#
# Без токена не работает вовсе — не «выключена настройкой», а не имеет
# адресата. Что именно уходит и что не уходит никогда, описано в
# docs/ru/protocol/aggregate.md.
cloud:
  token: ""
  # url: "https://updates.example.com/ingest"
  interval: 15m
