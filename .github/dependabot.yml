version: 2
updates:
  - package-ecosystem: gomod
    directory: "/"
    schedule:
      interval: weekly
    # go get quietly raises the go directive in go.mod, and for this
    # module that is a decision, not a detail: it is the lowest Go a
    # stranger needs to build the node. Every bump here gets read, not
    # merged on green — but read and taken, not read and ignored:
    # x/net/http2 terminates traffic from the open internet, and pinning
    # it below the line where its own go directive moved would mean
    # meeting the next HTTP/2 advisory with no upgrade path.
    open-pull-requests-limit: 5

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
    # Above the default of five. At five, dependabot opened requests for
    # the actions it fitted and silently dropped actions/checkout — which
    # was three majors behind. A cap that hides staleness is worse than
    # a noisy inbox.
    open-pull-requests-limit: 10
